<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 556" width="680" height="556" role="img" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>平台建设顺序与判据</title>
<desc>四段演进：单智能体基座、租户与身份隔离、多智能体委派、运行可视化。每一段的开工判据是上一段暴露出的具体问题，而不是时间表。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="556" fill="#FFFFFF"/>

<text x="40" y="30" font-size="12" fill="#5F5E5A">四段演进，每段的开工判据是上一段暴露出来的具体问题</text>

<!-- 四个阶段 -->
<rect x="40" y="48" width="136" height="72" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="108" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">① 单智能体基座</text>
<text x="108" y="88" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A">编排 · 工具网关</text>
<text x="108" y="103" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A">写操作审批</text>

<path d="M176 84 H188" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="48" width="136" height="72" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="258" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">② 租户与身份</text>
<text x="258" y="88" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#185FA5">RLS · Scope</text>
<text x="258" y="103" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#185FA5">连接器凭据</text>

<path d="M326 84 H338" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="340" y="48" width="136" height="72" rx="8" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="408" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">③ 多智能体</text>
<text x="408" y="88" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">委派 · 配额 · 产物</text>
<text x="408" y="103" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">A2A 协作</text>

<path d="M476 84 H488" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="490" y="48" width="150" height="72" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<text x="565" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">④ 运行可视化</text>
<text x="565" y="88" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#854F0B">L0 现在 · L1 平台</text>
<text x="565" y="103" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#854F0B">L2 拓扑 · L3 单次</text>

<!-- 每段的判据 -->
<path d="M108 120 V140" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<path d="M258 120 V140" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<path d="M408 120 V140" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<path d="M565 120 V140" fill="none" stroke="#D3D1C7" stroke-width="1"/>

<rect x="40" y="140" width="136" height="96" rx="8" fill="#FAFAF8" stroke="#E3E1D9" stroke-width="0.5"/>
<text x="52" y="158" font-size="10.5" fill="#5F5E5A">为什么先做这个</text>
<text x="52" y="178" font-size="10.5" fill="#888780">没有审批与工具边界，</text>
<text x="52" y="194" font-size="10.5" fill="#888780">任何一个 Agent 都能</text>
<text x="52" y="210" font-size="10.5" fill="#888780">直接改外部系统，</text>
<text x="52" y="226" font-size="10.5" fill="#888780">后面全是补不回来的账。</text>

<rect x="190" y="140" width="136" height="96" rx="8" fill="#FAFAF8" stroke="#E3E1D9" stroke-width="0.5"/>
<text x="202" y="158" font-size="10.5" fill="#5F5E5A">为什么排第二</text>
<text x="202" y="178" font-size="10.5" fill="#888780">第二个租户进来时才</text>
<text x="202" y="194" font-size="10.5" fill="#888780">发现「按 user_id 过</text>
<text x="202" y="210" font-size="10.5" fill="#888780">滤」不够。越晚改，</text>
<text x="202" y="226" font-size="10.5" fill="#888780">漏数据的面越大。</text>

<rect x="340" y="140" width="136" height="96" rx="8" fill="#FAFAF8" stroke="#E3E1D9" stroke-width="0.5"/>
<text x="352" y="158" font-size="10.5" fill="#5F5E5A">为什么要委派</text>
<text x="352" y="178" font-size="10.5" fill="#888780">一个 Agent 同时懂</text>
<text x="352" y="194" font-size="10.5" fill="#888780">客服和运维，等于把</text>
<text x="352" y="210" font-size="10.5" fill="#888780">两边的权限给了它。</text>
<text x="352" y="226" font-size="10.5" fill="#888780">拆开才有边界。</text>

<rect x="490" y="140" width="150" height="96" rx="8" fill="#FAFAF8" stroke="#E3E1D9" stroke-width="0.5"/>
<text x="502" y="158" font-size="10.5" fill="#5F5E5A">为什么最后补</text>
<text x="502" y="178" font-size="10.5" fill="#888780">单 Agent 时「慢在哪」</text>
<text x="502" y="194" font-size="10.5" fill="#888780">看日志就够。多 Agent</text>
<text x="502" y="210" font-size="10.5" fill="#888780">之后的问题是「在谁手</text>
<text x="502" y="226" font-size="10.5" fill="#888780">上、卡在哪」。</text>

<!-- 判据不是时间表 -->
<path d="M40 256 H640" fill="none" stroke="#E3E1D9" stroke-width="1"/>

<rect x="40" y="272" width="600" height="64" rx="8" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="56" y="294" font-size="11.5" fill="#0F6E56">判据是问题，不是日期</text>
<text x="56" y="316" font-size="10.5" fill="#0F6E56">每段都问一句「上一段暴露了什么具体问题」。答不上来就不开工——否则先付的是运维成本，收益还没出现。</text>

<!-- 每段都能独立上线 -->
<rect x="40" y="348" width="600" height="76" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="56" y="370" font-size="11.5" fill="#0C447C">每段都能独立上线、独立回滚</text>
<text x="56" y="390" font-size="10.5" fill="#185FA5">加列不改语义、加接口不改旧路径、关开关就回到上一段的行为。</text>
<text x="56" y="408" font-size="10.5" fill="#185FA5">做不到这一点的改动，说明它把两段耦合在了一起。</text>

<!-- 反例 -->
<rect x="40" y="436" width="600" height="80" rx="8" fill="#FCEBEB" stroke="#F7C1C1" stroke-width="0.5"/>
<text x="56" y="458" font-size="11.5" fill="#A32D2D">明确不做的三件事</text>
<text x="56" y="478" font-size="10.5" fill="#A32D2D">eval 评分层（与「在干什么」混在一起，两件事的可信度会双双下降）· 配置侧拓扑</text>
<text x="56" y="496" font-size="10.5" fill="#A32D2D">（平台没有编排配置，画出来就是编造）· 实时推送（时效要求是「一分钟内知道」，不是「实时」）</text>

<text x="40" y="540" font-size="10" fill="#B4B2A9">来源：docs/ARCHITECTURE.md、docs/RUNTIME_VIEW.md §10、docs/SANDBOX_ROADMAP.md</text>
</svg>
