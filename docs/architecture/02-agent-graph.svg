<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 467" width="680" height="467" role="img" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>LangGraph 执行图</title>
<desc>START 进入 plan_request，按意图分成对话、只读工具、知识检索、写操作审批四条分支，全部汇入 respond、persist_state 后结束。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="467" fill="#FFFFFF"/>

<circle cx="340" cy="40" r="9" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="358" y="40" dominant-baseline="central" font-size="11" fill="#185FA5">START</text>
<path d="M340 49 V70" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="74" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">plan_request</text>
<text x="340" y="108" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">意图识别 · 授权预检 · 取参数</text>

<path d="M340 126 V150" fill="none" stroke="#378ADD" stroke-width="1"/>
<path d="M340 150 H575" fill="none" stroke="#378ADD" stroke-width="1"/>
<path d="M110 150 V172" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M265 150 V172" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M420 150 V172" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M575 150 V172" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="45" y="176" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="110" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">对话直答</text>
<text x="110" y="214" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">chat · clarify</text>

<rect x="200" y="176" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="265" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">只读工具</text>
<text x="265" y="214" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">execute_read_tool</text>

<rect x="355" y="176" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="420" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">知识检索</text>
<text x="420" y="214" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">retrieve_knowledge</text>

<rect x="510" y="176" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="575" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">写操作审批</text>
<text x="575" y="214" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">interrupt 中断</text>

<path d="M110 232 V256" fill="none" stroke="#378ADD" stroke-width="1"/>
<path d="M265 232 V256" fill="none" stroke="#378ADD" stroke-width="1"/>
<path d="M420 232 V256" fill="none" stroke="#378ADD" stroke-width="1"/>
<path d="M575 232 V256" fill="none" stroke="#BA7517" stroke-width="1"/>
<path d="M110 256 H575" fill="none" stroke="#378ADD" stroke-width="1"/>
<path d="M340 256 V276" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="280" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">respond</text>
<text x="340" y="314" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">组装回答 · 附 citations</text>

<path d="M340 332 V348" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="352" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">persist_state</text>
<text x="340" y="386" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">会话与运行记录落库</text>

<path d="M340 404 V424" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="340" cy="438" r="9" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="358" y="438" dominant-baseline="central" font-size="11" fill="#185FA5">END</text>
</svg>
