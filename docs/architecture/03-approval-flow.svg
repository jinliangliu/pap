<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 254" width="680" height="254" role="img" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>写操作审批的跨请求执行与状态流转</title>
<desc>第一次请求在审批节点中断并落 checkpoint，第二次 confirm 请求恢复执行，状态从 PENDING 经 APPROVED、EXECUTING、EXECUTED 到 VERIFIED，异常时进入恢复或未知态。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="254" fill="#FFFFFF"/>

<text x="40" y="38" font-size="12" font-weight="500" fill="#185FA5">① 第一次请求 · POST /chat</text>
<text x="40" y="56" font-size="11" fill="#5F5E5A">执行到 create_and_wait_approval 触发 interrupt，checkpoint 写入 PostgreSQL，返回 awaiting_approval</text>

<rect x="40" y="76" width="104" height="52" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="92" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#854F0B">PENDING</text>
<text x="92" y="112" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">等待确认</text>

<rect x="164" y="76" width="104" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="216" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">APPROVED</text>
<text x="216" y="112" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">已确认待执行</text>

<rect x="288" y="76" width="104" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">EXECUTING</text>
<text x="340" y="112" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">调用外部系统</text>

<rect x="412" y="76" width="104" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="464" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">EXECUTED</text>
<text x="464" y="112" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">已返回未核验</text>

<rect x="536" y="76" width="104" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="588" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">VERIFIED</text>
<text x="588" y="112" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">回读核验通过</text>

<path d="M144 102 H160" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M268 102 H284" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M392 102 H408" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M516 102 H532" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M92 128 V150 H125 V166" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M340 128 V150" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M340 150 H335 V166" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M340 150 H545 V166" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="40" y="172" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5"/>
<text x="125" y="188" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#993C1D">REJECTED · EXPIRED</text>
<text x="125" y="204" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">拒绝或超时，不执行</text>

<rect x="250" y="172" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5"/>
<text x="335" y="188" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#993C1D">RECOVERY_REQUIRED</text>
<text x="335" y="204" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">异常，按幂等键回读</text>

<rect x="460" y="172" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5"/>
<text x="545" y="188" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#993C1D">EXECUTION_UNKNOWN</text>
<text x="545" y="204" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">禁止自动重发</text>

<text x="40" y="238" font-size="11" fill="#5F5E5A">② 另一个请求 POST /approvals/{id}/confirm 恢复执行；③ 幂等键 approval:{thread_id}:{run_id} 保证重复确认返回同一结果</text>
</svg>
