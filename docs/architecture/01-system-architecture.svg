<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>Personal Agent Platform 系统架构</title>
<desc>五层架构：Nginx 接入层、FastAPI 应用层、LangGraph 智能体层、工具与连接器能力层、PostgreSQL 与对象存储数据层；右侧为平台调用的外部系统（模型供应商、远程 MCP Server、内网办公系统、沙箱执行环境）。</desc>
