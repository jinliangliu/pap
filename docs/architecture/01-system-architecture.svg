<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684" width="680" height="684" role="img" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>Personal Agent Platform 系统架构</title>
<desc>五层架构：Nginx 接入层、FastAPI 应用层、LangGraph 智能体层、工具与检索能力层、PostgreSQL 与 Redis 数据层。</desc>
<defs>
