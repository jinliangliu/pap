<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="684" fill="#FFFFFF"/>

<rect x="40" y="40" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="140" y="57" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">客户端 / 调用方</text>
<text x="140" y="73" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">HTTP · Basic Auth</text>

<rect x="452" y="40" width="188" height="44" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="546" y="57" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">LangGraph Studio</text>
<text x="546" y="73" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">SSH 隧道 → :2024</text>

<path d="M140 84 V112" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M620 84 V380 H602" fill="none" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="40" y="116" width="560" height="76" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="54" y="133" font-size="12" fill="#185FA5">接入层</text>
<rect x="55" y="146" width="250" height="36" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="180" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Nginx 反向代理 · 仅监听 :80</text>
