# SSH 连接限值调优（/etc/ssh/sshd_config.d/99-pap-limits.conf）
#
# 现象：短时间内多次新建 SSH 连接后，新连接在 key exchange 阶段被 reset，
# 表现为 `Connection closed by <ip> port 22` / `Connection reset by peer`，
# 而且 TCP 能握手、却读不到 banner。
#
# 原因：sshd 默认 MaxStartups 10:30:100 —— 未认证连接达到 10 个开始随机丢弃，
# 到 30 个全部丢弃。被丢弃的连接不会立刻消失，每个要等 LoginGraceTime(120s)
# 超时才释放，所以一旦触发就是持续几分钟的"连不上"。
# 默认 ClientAliveInterval 0 又意味着死连接永远不会被主动清理。
#
# 安装：
#   install -m 644 deploy/ssh/99-pap-limits.conf /etc/ssh/sshd_config.d/
#   sshd -t && systemctl reload ssh     # reload 不会断开现有连接
#
# 注意：先确认 /etc/ssh/sshd_config 里有 `Include /etc/ssh/sshd_config.d/*.conf`。
# 同名项以**先出现**的为准，drop-in 按文件名排序，所以本文件名用 99- 前缀
# 只能覆盖主文件里靠后的同名项；若其他 drop-in（如 50-cloud-init.conf）
# 也设置了同一项，那个会先生效。
#
MaxStartups 30:50:100
ClientAliveInterval 60
ClientAliveCountMax 3
