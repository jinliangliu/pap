# Nginx 反向代理：Personal Agent Platform
#
# 部署位置：/etc/nginx/sites-available/personal-agent-platform
# 启用方式：ln -s ../sites-available/personal-agent-platform /etc/nginx/sites-enabled/
#
# 职责边界（重要）：
#   1. 认证在 Nginx 完成（此处用 HTTP Basic）；
#   2. Nginx 覆盖式写入 X-Authenticated-Subject，客户端自带的同名头一律丢弃；
#   3. 应用以 AUTH_MODE=gateway 运行，只信任这里注入的身份。
# 三者缺一不可：只做反代不改 AUTH_MODE，等于把身份头交给公网任意伪造。

limit_req_zone $binary_remote_addr zone=pap_api:10m rate=10r/s;
# 对外 MCP 通道单独一个桶：一次委派可能占用连接 30 秒，
# 和浏览器控制台共用 pap_api 时，几个并发委派就能把界面刷成 429。
limit_req_zone $binary_remote_addr zone=pap_mcp:10m rate=4r/s;

upstream pap_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 全站基础认证。账号用 htpasswd 维护，映射到 users.external_subject。
    auth_basic "Personal Agent Platform";
    auth_basic_user_file /etc/nginx/pap.htpasswd;

    # 对话附件走 base64 内联，体积会膨胀约 4/3：
    # 后端 CHAT_MAX_ATTACHMENT_BYTES=40MB → 请求体上限约 54MB，留余量取 64m。
    # 这里若小于后端上限，用户会看到 Nginx 的 413，而后端根本没被调用。
    client_max_body_size 64m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    # SAMEORIGIN 而不是 DENY：气泡里的 PDF 预览是 <embed> 调浏览器内置阅读器，
    # DENY 会让它整块空白。文件接口本身有会话归属校验，同源内嵌不扩大暴露面。
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # 就绪探针：只允许本机访问，供监控与自检使用
    location = /health {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://pap_api;
        proxy_set_header Host $host;
    }

    # 指标与交互式文档不对外暴露
    location = /metrics {
        return 404;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # 浏览器控制台：同源静态页，页面内部直接请求 /api/v1/*，不涉及 CORS。
    # 认证仍由上面的 server 级 auth_basic 承担——location 里没有重新声明，
    # 因此继承；不要在此处写 auth_basic off，那等于把控制台变成免认证入口。
    location = /console {
        return 301 /console/;
    }

    location /console/ {
        alias /personal-agent-platform/static/console/;
        index index.html;

        # 页面本身没有副作用，不占用 API 的限流桶。
        # 用 expires 而不是 add_header：后者会让本 location 丢掉 server 级
        # 那三个安全响应头（add_header 是整段覆盖，不做子集继承）。
        expires -1;
    }

    # 对外 MCP 通道（WorkBuddy 连接器等程序化调用方）。
    #
    # 用正则而不用 `location = /mcp`：应用同时接受 `/mcp` 与 `/mcp/`
    # （见 app/mcp_server/auth.py 的前缀判断），只写等号会让带尾斜杠的
    # 请求掉进下面的 `location /`，被 Basic 认证挡成 401——
    # 表现是「客户端有时候连得上、有时候 401」，极难查。
    #
    # **auth_basic off 是必须的，也是安全的**：
    #   - 必须：把 Basic 口令写进连接器配置等于把明文凭据落到用户机器上，
    #     还是所有人共用一份；
    #   - 安全：这个端点不接受任何「网关注入的身份」，只认 Authorization
    #     里的 Bearer 令牌，校验在应用层完成（api_tokens 表 + subject 解析），
    #     而且 fail-closed——没有可用凭据一律 401。
    # 下面两行把身份头显式清空，防止调用方自带 subject 影响任何下游判断。
    # 覆盖 `/mcp`、`/mcp/` 与 `/mcp/upload`（上传端点）。
    # 写成 `^/mcp(/|$)` 而不是 `^/mcp/?$`：后者只匹配到第一段，
    # `/mcp/upload` 会掉进 `location /` 被 Basic 挡成 401，
    # 表现是「握手正常、上传 401」，比完全不通报错更费解。
    location ~ ^/mcp(/|$) {
        auth_basic off;
        limit_req zone=pap_mcp burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://pap_api;
        proxy_http_version 1.1;

        proxy_set_header X-Authenticated-Subject "";
        proxy_set_header X-Authenticated-Tenant "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 必须大于 MCP_INBOUND_WAIT_SECONDS（默认 30）：小于它时，
        # 后端明明会自己收尾并返回 running + task_id，用户却只看到 504。
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # JSON 响应下没有 SSE 事件流，关掉缓冲免得响应被攒住。
        proxy_buffering off;
    }

    location / {
        limit_req zone=pap_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://pap_api;
        proxy_http_version 1.1;

        # 身份只来自上面的 Basic 认证结果。
        # proxy_set_header 是「覆盖」语义：客户端伪造的同名头到这里已被替换。
        proxy_set_header X-Authenticated-Subject $remote_user;
        # 空值表示该头不下发，避免客户端自带 tenant 影响租户判定。
        proxy_set_header X-Authenticated-Tenant "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 对话接口会同步等待模型返回，读超时必须明显大于后端的总时限
        # （CHAT_TIMEOUT_SECONDS=160）。若小于它，后端明明会自己收尾并返回
        # 一条「已中止」，用户却只看到 Nginx 的 504——2026-11-04 事故的表象。
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;

        # 不做缓冲，避免长请求被 Nginx 攒住
        proxy_buffering off;
    }
}
